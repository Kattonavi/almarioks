[package]
name = "almarioks"
description = "AlmarioKS desktop app (Tauri 2)"
authors = ["Kattonavi"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows (rust-lang/cargo#8519).
name = "almarioks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# Pinned to the 2.12 line by hand: `cargo add tauri` resolves to the 3.0 alpha.
tauri = { version = "~2.12.5", features = [] }
# `generate_context!` emits the `plugins` config of tauri.conf.json as `serde_json` values.
serde_json = "1.0.149"

# Desktop only (ADR-0003). Pinned to 2.x by hand: `cargo add` resolves to the 3.0 alpha.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "~2.14.1"

[dev-dependencies]
# tests/updater_signature.rs: the real updater plugin on the mock runtime, against a local HTTP server.
tauri = { version = "~2.12.5", features = ["test"] }
# Test-only signing keys, made the way the Tauri CLI 2.12 makes them (minisign 0.9 + base64 of the box).
minisign = "=0.9.1"
base64 = "=0.22.1"

[lints]
workspace = true
