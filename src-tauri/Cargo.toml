[package]
name = "almarioks"
description = "AlmarioKS desktop app (Tauri 2)"
authors = ["Kattonavi"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows (rust-lang/cargo#8519).
name = "almarioks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# Pinned to the 2.12 line by hand: `cargo add tauri` resolves to the 3.0 alpha.
tauri = { version = "~2.12.5", features = [] }
# Error codes of the spec (`Bloqueada`, `ArgumentoInvalido`) for the clipboard service.
almarioks-core = { workspace = true }
# The copied secret enters the clipboard service as a type that is wiped when dropped (RF-71).
secrecy = { workspace = true }
thiserror = { workspace = true }
# Wipes the UTF-16 copy of the value on its way to the clipboard.
zeroize = { workspace = true }
# `generate_context!` emits the `plugins` config of tauri.conf.json as `serde_json` values. The commands also
# receive their `args` as a `serde_json::Value` and deserialize it themselves (RF-80).
serde_json = "1.0.149"
# Command arguments (`deny_unknown_fields`) and answers (spec 001, section J).
serde = { version = "1.0.229", features = ["derive"] }
# RF-49: parse the URL of an entry before handing it to the system. Already in the tree of `tauri` at this version.
url = "2.5.8"
# File dialogs and "open in the browser", used ONLY from Rust: the window gets no `dialog:*` or `opener:*`
# permission (plan, "Decisiones"). Pinned to 2.x by hand: `cargo add` resolves to the 3.0 alpha.
tauri-plugin-dialog = "~2.8.4"
tauri-plugin-opener = "~2.7.3"

# Desktop only (ADR-0003). Pinned to 2.x by hand: `cargo add` resolves to the 3.0 alpha.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "~2.14.1"
# RF-81: one instance per user session. Registered FIRST in `lib.rs`.
tauri-plugin-single-instance = "~2.5.5"

# Clipboard (`src/clipboard/ffi.rs`, the only module with `unsafe`): owner window, exclusion formats and
# clear-by-sequence-number, as measured in docs/lab/boveda-0.1 (P1). MIT OR Apache-2.0.
# `Win32_System_Com` is only for the test probe that enters a single-threaded apartment.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_WindowsAndMessaging",
] }
# WebView2 settings (`src/webview/ffi.rs`, the other module with `unsafe`): Tauri 2.12 does not expose the two
# that switch off the context menu and the accelerator keys of the browser (D-9). The same crate and version
# `tauri` and `wry` already bring, so the controller `with_webview` hands over is this type: no new code. MIT.
webview2-com = "=0.39.1"

# tests/clipboard_win32.rs: asks the WinRT clipboard history whether it kept the canary (RF-72).
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.62.2", features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Foundation_Collections",
] }

[dev-dependencies]
# tests/updater_signature.rs: the real updater plugin on the mock runtime, against a local HTTP server.
tauri = { version = "~2.12.5", features = ["test"] }
# Test-only signing keys, made the way the Tauri CLI 2.12 makes them (minisign 0.9 + base64 of the box).
minisign = "=0.10.0"
base64 = "=0.23.1"
# tests/common/vault.rs: fills the canary vault of RF-76 with protected notes and a protected custom field, which
# the app cannot create (spec, "Fuera de alcance"). Test-only, like `minisign`: no code of the app names it
# (constitution rule 4). Same version the core wraps, already in the tree.
keepass = { workspace = true }

[lints]
workspace = true
