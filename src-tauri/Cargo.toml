[package]
name = "almarioks"
description = "AlmarioKS desktop app (Tauri 2)"
authors = ["Kattonavi"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows (rust-lang/cargo#8519).
name = "almarioks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# Pinned to the 2.12 line by hand: `cargo add tauri` resolves to the 3.0 alpha.
tauri = { version = "~2.12.5", features = [] }

[lints]
workspace = true
