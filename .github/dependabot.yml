version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      rust:
        patterns: ["*"]
    ignore:
      # Tauri 3 is still alpha: stay on 2.x until an ADR says otherwise.
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-major"]
      # Pinned on purpose (ADR-0001): bump only with the round-trip corpus green.
      - dependency-name: keepass
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ["*"]
