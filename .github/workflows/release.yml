name: release
# Runs only for version tags. Tags v* are protected by a ruleset and the `release`
# environment requires approval, so the updater signing key is never exposed to PRs.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      BUNDLE_DIR: target/release/bundle/nsis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Tag must match the app version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cargo metadata --no-deps --format-version 1 --locked > metadata.json
          version=$(node -p "require('./metadata.json').packages.find(p => p.name === 'almarioks').version")
          web_version=$(node -p "require('./package.json').version")
          rm metadata.json
          if [ "v$version" != "$TAG" ] || [ "$web_version" != "$version" ]; then
            echo "tag $TAG, Cargo version $version and package.json version $web_version must match" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Build and sign the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build
      - name: Updater manifest and checksums
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          node scripts/release-manifest.mjs "$BUNDLE_DIR" "$VERSION" "$REPO" "Versión de desarrollo. No la uses con tus contraseñas reales."
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/latest.json
      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "$BUNDLE_DIR"/*-setup.exe "$BUNDLE_DIR"/*-setup.exe.sig "$BUNDLE_DIR"/latest.json "$BUNDLE_DIR"/SHA256SUMS \
            --verify-tag --title "AlmarioKS $TAG" --notes-file docs/RELEASE_NOTES.md --latest
