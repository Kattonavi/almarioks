# cargo-deny 0.20 configuration (R-6). Run: `cargo deny check`.
# Base generated with `cargo deny init`; trimmed to what this project decides.

[graph]
# Windows first (PROYECTO.md). Add targets here when Linux or macOS enter the scope.
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[output]
feature-depth = 1

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails the check unless it is
# listed here with its reason and a task in docs/BACKLOG.md.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Only licenses compatible with distributing AlmarioKS under GPL-3.0-only.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
# Path dependencies inside the workspace have no version; crates.io ones must never be `*`.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
# crates.io only: no git branches, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
