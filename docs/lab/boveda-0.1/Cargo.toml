[package]
name = "boveda-lab"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "GPL-3.0-only"
description = "Lab for phase 0.1 (vault): clipboard, session lock, atomic save, keepass 0.17 API, secrets."

# Empty workspace: this crate must not join the project's workspace.
[workspace]

[dependencies]
keepass = { version = "=0.17.0", features = ["save_kdbx4"] }
zeroize = { version = "=1.9.1", features = ["zeroize_derive"] }
secrecy = "=0.10.3"
zxcvbn = { version = "=3.1.1", default-features = false }
# Lab only: recompute the KDBX 4 header SHA-256 after tampering with the KDF parameters.
sha2 = "0.10"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Foundation_Collections",
] }

[[bin]]
name = "p1_clipboard"
path = "src/bin/p1_clipboard.rs"

[[bin]]
name = "p2_session"
path = "src/bin/p2_session.rs"

[[bin]]
name = "p3_atomic"
path = "src/bin/p3_atomic.rs"

[[bin]]
name = "p4_keepass"
path = "src/bin/p4_keepass.rs"

[[bin]]
name = "p5_secrets"
path = "src/bin/p5_secrets.rs"

# `pnpm tauri dev` builds in debug: this profile shows what an opt-level override on the KDF crate buys there.
[profile.devkdf]
inherits = "dev"

[profile.devkdf.package.rust-argon2]
opt-level = 3
